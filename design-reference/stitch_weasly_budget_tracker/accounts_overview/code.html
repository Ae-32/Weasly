<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Accounts List - Weasly</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#317054",
                        "on-surface-variant": "#534438",
                        "surface-tint": "#8e4e00",
                        "on-secondary-fixed-variant": "#0b5137",
                        "inverse-on-surface": "#fceee7",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#6c3a00",
                        "primary-fixed": "#ffdcc1",
                        "surface": "#fff8f5",
                        "on-tertiary-container": "#453000",
                        "borderDefault": "#E8E1D8",
                        "outline": "#867466",
                        "bgSurface": "#FFFFFF",
                        "tertiary-container": "#c5942c",
                        "primary-container": "#d98a3d",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#94d4b2",
                        "surface-container-high": "#f3e5df",
                        "surface-dim": "#e5d7d1",
                        "inverse-primary": "#ffb778",
                        "secondary-fixed": "#aff1cd",
                        "inverse-surface": "#362f2b",
                        "textMuted": "#8A7F73",
                        "on-primary": "#ffffff",
                        "on-background": "#211a16",
                        "tertiary": "#7b5800",
                        "on-error-container": "#93000a",
                        "secondary": "#2b694e",
                        "surface-container-low": "#fff1ea",
                        "surface-variant": "#ede0d9",
                        "on-primary-fixed": "#2e1500",
                        "bgBase": "#FAF7F2",
                        "tertiary-fixed": "#ffdea6",
                        "on-primary-container": "#512a00",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#5d4200",
                        "primary-fixed-dim": "#ffb778",
                        "secondary-container": "#aff1cd",
                        "background": "#fff8f5",
                        "tertiary-fixed-dim": "#f4be53",
                        "surface-bright": "#fff8f5",
                        "on-secondary-fixed": "#002113",
                        "on-tertiary-fixed": "#271900",
                        "on-secondary": "#ffffff",
                        "stateError": "#D64545",
                        "primary": "#8e4e00",
                        "on-surface": "#211a16",
                        "outline-variant": "#d8c2b3",
                        "surface-container": "#f9ebe5",
                        "surface-container-highest": "#ede0d9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "margin-tablet": "32px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "stack-lg": "24px",
                        "base-unit": "4px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["Quicksand"],
                        "body-md": ["Quicksand"],
                        "numeric-body": ["Quicksand"],
                        "label-md": ["Quicksand"],
                        "headline-sm": ["Quicksand"],
                        "headline-lg": ["Quicksand"],
                        "body-sm": ["Quicksand"],
                        "headline-md": ["Quicksand"],
                        "numeric-display": ["Quicksand"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "numeric-body": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "numeric-display": ["28px", { "lineHeight": "34px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .ambient-shadow { box-shadow: 0 4px 12px rgba(43, 36, 32, 0.04); }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.4); }
    </style>
</head>
<body class="bg-bgBase text-on-background min-h-screen font-body-md pb-[100px] flex justify-center">
<div class="w-full max-w-[600px] flex flex-col relative min-h-screen">
<!-- TopAppBar -->
<header class="bg-background dark:bg-on-background docked full-width top-0 z-40">
<div class="flex justify-between items-center w-full px-margin-mobile h-16">
<!-- Leading -->
<div class="flex items-center gap-2">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center overflow-hidden border-2 border-bgBase">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
</div>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Weasly</h1>
<!-- Trailing -->
<button class="w-10 h-10 rounded-full flex items-center justify-center text-primary dark:text-primary-fixed hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile py-stack-md flex flex-col gap-stack-lg">
<!-- Total Balance Section -->
<section class="flex flex-col items-center justify-center py-stack-lg bg-surface-container-lowest rounded-2xl ambient-shadow">
<h2 class="font-body-md text-body-md text-textMuted mb-stack-sm">Total Balance</h2>
<div class="font-numeric-display text-numeric-display text-on-background tracking-tight">₱12,450.00</div>
</section>
<!-- Accounts List -->
<section class="flex flex-col gap-stack-md">
<div class="flex justify-between items-end mb-stack-sm">
<h3 class="font-headline-sm text-headline-sm text-on-background">Your Stashes</h3>
<button class="font-label-md text-label-md text-primary flex items-center gap-1 hover:opacity-80">
<span class="material-symbols-outlined text-[16px]">add</span> Add
                    </button>
</div>
<!-- Account Card: Cash -->
<div class="bg-bgSurface rounded-2xl p-stack-md ambient-shadow flex items-center justify-between group cursor-pointer hover:bg-surface-container-low transition-colors duration-200 border border-transparent hover:border-borderDefault">
<div class="flex items-center gap-stack-md">
<div class="w-12 h-12 rounded-xl bg-tertiary-container flex items-center justify-center text-on-tertiary-container shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-background">Cash Wallet</span>
<span class="font-body-sm text-body-sm text-textMuted">Everyday spending</span>
</div>
</div>
<div class="font-numeric-body text-numeric-body text-on-background tabular-nums">₱450.00</div>
</div>
<!-- Account Card: GCash -->
<div class="bg-bgSurface rounded-2xl p-stack-md ambient-shadow flex items-center justify-between group cursor-pointer hover:bg-surface-container-low transition-colors duration-200 border border-transparent hover:border-borderDefault">
<div class="flex items-center gap-stack-md">
<div class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center text-on-primary-container shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">phone_iphone</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-background">GCash</span>
<span class="font-body-sm text-body-sm text-textMuted">Digital transactions</span>
</div>
</div>
<div class="font-numeric-body text-numeric-body text-on-background tabular-nums">₱1,200.00</div>
</div>
<!-- Account Card: Bank -->
<div class="bg-bgSurface rounded-2xl p-stack-md ambient-shadow flex items-center justify-between group cursor-pointer hover:bg-surface-container-low transition-colors duration-200 border border-transparent hover:border-borderDefault">
<div class="flex items-center gap-stack-md">
<div class="w-12 h-12 rounded-xl bg-secondary-container flex items-center justify-center text-on-secondary-container shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-background">Main Bank</span>
<span class="font-body-sm text-body-sm text-textMuted">Savings &amp; Salary</span>
</div>
</div>
<div class="font-numeric-body text-numeric-body text-on-background tabular-nums">₱10,800.00</div>
</div>
</section>
</main>
<!-- BottomNavBar (Semantic Match: Budgets / Accounts context) -->
<nav class="bg-bgSurface dark:bg-inverse-surface shadow-[0_-4px_12px_rgba(43,36,32,0.04)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter py-2 pb-safe md:hidden rounded-t-xl"><!-- Dashboard -->
<button class="flex flex-col items-center justify-center text-textMuted dark:text-outline-variant px-4 py-1 hover:bg-surface-container-low dark:hover:bg-surface-variant scale-95 active:scale-90 transition-transform duration-150 rounded-xl group">
<span class="material-symbols-outlined mb-1 group-hover:text-primary transition-colors">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</button>
<!-- Transactions -->
<button class="flex flex-col items-center justify-center text-textMuted dark:text-outline-variant px-4 py-1 hover:bg-surface-container-low dark:hover:bg-surface-variant scale-95 active:scale-90 transition-transform duration-150 rounded-xl group">
<span class="material-symbols-outlined mb-1 group-hover:text-primary transition-colors">receipt_long</span>
<span class="font-label-md text-label-md">Transactions</span>
</button>
<!-- Budgets -->
<button class="flex flex-col items-center justify-center text-textMuted dark:text-outline-variant px-4 py-1 hover:bg-surface-container-low dark:hover:bg-surface-variant scale-95 active:scale-90 transition-transform duration-150 rounded-xl group">
<span class="material-symbols-outlined mb-1 group-hover:text-primary transition-colors">account_balance_wallet</span>
<span class="font-label-md text-label-md">Budgets</span>
</button>
<!-- Accounts (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-xl px-4 py-1 scale-95 active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="font-label-md text-label-md">Accounts</span>
</button></nav>
<!-- Desktop Nav (Hidden on mobile, matching TopAppBar design) -->
<nav class="hidden md:flex fixed top-16 left-0 w-full bg-bgSurface shadow-sm z-30 justify-center gap-8 py-3">
<button class="text-textMuted hover:text-primary font-body-md flex items-center gap-2"><span class="material-symbols-outlined">dashboard</span> Dashboard</button>
<button class="text-textMuted hover:text-primary font-body-md flex items-center gap-2"><span class="material-symbols-outlined">receipt_long</span> Activity</button>
<button class="text-primary font-body-md font-semibold flex items-center gap-2 border-b-2 border-primary pb-1"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span> Accounts</button>
<button class="text-textMuted hover:text-primary font-body-md flex items-center gap-2"><span class="material-symbols-outlined">settings</span> Settings</button>
</nav>
</div>


</body></html>
