<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Weasly - Add/Edit Budget</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

                        "outline": "#867466",
                        "bgSurface": "#FFFFFF",
                        "tertiary-container": "#c5942c",
                        "primary-container": "#d98a3d",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#94d4b2",
                        "surface-container-high": "#f3e5df",
                        "surface-dim": "#e5d7d1",
                        "inverse-primary": "#ffb778",
                        "secondary-fixed": "#aff1cd",
                        "inverse-surface": "#362f2b",
                        "textMuted": "#8A7F73",
                        "on-primary": "#ffffff",
                        "on-background": "#211a16",
                        "tertiary": "#7b5800",
                        "on-error-container": "#93000a",
                        "secondary": "#2b694e",
                        "surface-container-low": "#fff1ea",
                        "surface-variant": "#ede0d9",
                        "on-primary-fixed": "#2e1500",
                        "bgBase": "#FAF7F2",
                        "tertiary-fixed": "#ffdea6",
                        "on-primary-container": "#512a00",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#5d4200",
                        "primary-fixed-dim": "#ffb778",
                        "secondary-container": "#aff1cd",
                        "background": "#fff8f5",
                        "tertiary-fixed-dim": "#f4be53",
                        "surface-bright": "#fff8f5",
                        "on-secondary-fixed": "#002113",
                        "on-tertiary-fixed": "#271900",
                        "on-secondary": "#ffffff",
                        "stateError": "#D64545",

                    "borderRadius": {

                        "xl": "0.75rem",
                        "2xl": "1rem",

                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "margin-tablet": "32px",
                        "gutter": "16px",

                        "level2": "0 8px 20px rgba(43,36,32,0.08)"

<style>
        body { background-color: theme('colors.bgBase'); color: theme('colors.on-background'); }
        /* Hide scrollbar for clean modal look if scrolling is needed */
        ::-webkit-scrollbar { display: none; }
        
        .modal-overlay {
            background-color: rgba(33, 26, 22, 0.4);
            backdrop-filter: blur(4px);
        }
        
        .modal-sheet {
            animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        
        .radio-card input:checked + div {
            border-color: theme('colors.accentPrimary');
            background-color: theme('colors.surface-container-low');
        }
        .radio-card input:checked + div .radio-icon {
            color: theme('colors.accentPrimary');
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="font-body-md antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Context (Blurred out Dashboard behind the modal) -->
<div aria-hidden="true" class="absolute inset-0 z-0 opacity-40 blur-sm pointer-events-none flex flex-col">
<!-- TopAppBar Context -->
<header class="bg-background flex justify-between items-center w-full px-margin-mobile h-16">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container" style="font-size: 18px;">pets</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Weasly</h1>
</div>
<span class="material-symbols-outlined text-primary" style="font-size: 24px;">notifications</span>
</header>
<div class="p-margin-mobile flex flex-col gap-stack-lg mt-8">
<div class="bg-bgSurface rounded-2xl p-stack-md shadow-level1 h-32 w-full max-w-md mx-auto"></div>
<div class="bg-bgSurface rounded-2xl p-stack-md shadow-level1 h-48 w-full max-w-md mx-auto"></div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-40 modal-overlay flex flex-col justify-end md:justify-center items-center p-0 md:p-margin-mobile">
<!-- Modal Content Sheet -->
<div class="modal-sheet bg-bgSurface w-full max-w-[600px] md:rounded-3xl rounded-t-3xl rounded-b-none shadow-level2 flex flex-col max-h-[90vh] relative z-50">
<!-- Drag Handle (Mobile) -->
<div class="w-full flex justify-center pt-3 pb-1 md:hidden">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="flex justify-between items-center px-margin-mobile py-stack-md border-b border-borderDefault/50">
<h2 class="font-headline-sm text-headline-sm text-on-background">Set Budget</h2>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-margin-mobile py-stack-lg flex flex-col gap-stack-lg">
<!-- Category Selection -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-textMuted uppercase">Category</label>
<div class="relative">
<select class="w-full appearance-none bg-bgBase border border-borderDefault text-textPrimary font-body-md text-body-md rounded-xl px-4 py-3 focus:outline-none focus:border-accentPrimary focus:ring-1 focus:ring-accentPrimary transition-colors pr-10">
<option disabled="" selected="" value="">Select a category...</option>
<option value="groceries">Groceries</option>
<option value="dining">Dining Out</option>
<option value="transportation">Transportation</option>
<option value="entertainment">Entertainment</option>
<option value="shopping">Shopping</option>
<option value="utilities">Utilities</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
<!-- Quick Select Chips -->
<div class="flex flex-wrap gap-2 mt-2">
<button class="px-3 py-1.5 rounded-lg bg-surface-container-low text-accentPrimary font-label-md text-label-md flex items-center gap-1 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-size: 14px;">shopping_cart</span> Groceries
                        </button>
<button class="px-3 py-1.5 rounded-lg bg-surface-container-low text-accentPrimary font-label-md text-label-md flex items-center gap-1 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-size: 14px;">restaurant</span> Dining Out
                        </button>
</div>
</div>
<!-- Amount Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-textMuted uppercase">Amount</label>
<div class="relative flex items-center">
<span class="absolute left-4 font-numeric-display text-numeric-display text-outline-variant">$</span>
<input class="w-full bg-bgBase border border-borderDefault text-textPrimary font-numeric-display text-numeric-display rounded-xl py-4 pl-12 pr-4 focus:outline-none focus:border-accentPrimary focus:ring-1 focus:ring-accentPrimary transition-colors text-right" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Period Selection (Radio Cards) -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-textMuted uppercase">Period</label>
<div class="grid grid-cols-3 gap-2">
<!-- Weekly -->
<label class="radio-card cursor-pointer relative">
<input class="sr-only" name="period" type="radio" value="weekly"/>
<div class="h-full border border-borderDefault rounded-xl p-3 flex flex-col items-center justify-center gap-1 transition-all hover:bg-surface-variant">
<span class="material-symbols-outlined radio-icon text-outline-variant" style="font-size: 20px;">calendar_view_week</span>
<span class="font-body-sm text-body-sm font-medium text-center">Weekly</span>
</div>
</label>
<!-- Monthly (Selected by default) -->
<label class="radio-card cursor-pointer relative">
<input checked="" class="sr-only" name="period" type="radio" value="monthly"/>
<div class="h-full border border-borderDefault rounded-xl p-3 flex flex-col items-center justify-center gap-1 transition-all hover:bg-surface-variant">
<span class="material-symbols-outlined radio-icon text-outline-variant" style="font-size: 20px;">calendar_month</span>
<span class="font-body-sm text-body-sm font-medium text-center">Monthly</span>
</div>
</label>
<!-- Custom -->
<label class="radio-card cursor-pointer relative">
<input class="sr-only" name="period" type="radio" value="custom"/>
<div class="h-full border border-borderDefault rounded-xl p-3 flex flex-col items-center justify-center gap-1 transition-all hover:bg-surface-variant">
<span class="material-symbols-outlined radio-icon text-outline-variant" style="font-size: 20px;">date_range</span>
<span class="font-body-sm text-body-sm font-medium text-center">Custom</span>
</div>
</label>
</div>
</div>
<!-- Notification Toggle (Optional detail for warmth/utility) -->
<div class="flex items-center justify-between p-4 bg-bgBase rounded-xl border border-borderDefault/50">
<div class="flex flex-col">
<span class="font-body-md text-body-md font-medium text-textPrimary">Alert me</span>
<span class="font-body-sm text-body-sm text-textMuted">When 80% is reached</span>
</div>
<!-- Custom Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-accentSecondary"></div>
</label>
</div>
</div>
<!-- Footer / Action Area -->
<div class="px-margin-mobile py-stack-md pb-[calc(16px+env(safe-area-inset-bottom))] border-t border-borderDefault/50 bg-bgSurface md:rounded-b-3xl">
<button class="w-full bg-accentPrimary text-white font-body-lg text-body-lg rounded-xl py-4 flex items-center justify-center gap-2 hover:opacity-90 transition-opacity shadow-sm active:scale-[0.98]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 20px;">savings</span>
                    Set Budget
                </button>
</div>
</div>
</div>
</body></html>
