<h1 class="font-headline-lg text-headline-lg text-primary">Join Weasly</h1>
<p class="font-body-md text-body-md text-textMuted max-w-xs mx-auto">Start stashing your resources today.</p>
</div>
<!-- Form Card -->
<div class="bg-bgSurface rounded-2xl shadow-soft p-stack-md w-full border border-borderDefault">
<form class="space-y-stack-md" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-textMuted" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full bg-bgBase border border-borderDefault rounded-xl pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-textMuted focus:outline-none focus:ring-1 focus:ring-accentPrimary focus:border-accentPrimary transition-colors duration-200" id="fullName" name="fullName" placeholder="Weasly User" required="" type="text">
</div>
</div>
<!-- Email Field -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-textMuted" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-bgBase border border-borderDefault rounded-xl pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-textMuted focus:outline-none focus:ring-1 focus:ring-accentPrimary focus:border-accentPrimary transition-colors duration-200" id="email" name="email" placeholder="you@example.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-textMuted" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-bgBase border border-borderDefault rounded-xl pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-textMuted focus:outline-none focus:ring-1 focus:ring-accentPrimary focus:border-accentPrimary transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-textMuted hover:text-on-surface focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="password-visibility-icon" style="font-variation-settings: &quot;FILL&quot; 0;">Sign Up with Google</span>
</button>
</div>
</div>
<!-- Create Account Button -->
<button class="w-full bg-accentPrimary hover:bg-primary-container text-white font-body-md text-body-md font-semibold py-3 px-4 rounded-xl shadow-floating hover:shadow-soft transition-all duration-200 active:scale-[0.98] mt-stack-md flex justify-center items-center gap-2" type="submit">
<span class="">Create Account</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-stack-lg relative flex items-center justify-center">

</button>
</div>
<!-- Login Link -->
<div class="mt-stack-lg text-center pb-8">
<p class="font-body-md text-body-md text-textMuted">
                Already have an account? 
                <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-2" href="#">Login</a>
</p>

</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('password-visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }
    </script>
