<!-- Password Field -->

<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="password">Password</label>
<input class="w-full bg-bgSurface border border-borderDefault rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" type="password">
<div class="flex justify-end mt-2">
<a class="font-body-sm text-body-sm text-primary hover:underline" href="#">Forgot Password?</a>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary text-on-primary font-body-lg text-body-lg py-3 rounded-[12px] hover:opacity-90 transition-opacity mt-stack-sm flex items-center justify-center gap-2" type="button">
                    Sign In
