<p class="font-body-md text-body-md text-textMuted max-w-xs mb-stack-lg">

            </p>

<button class="bg-primary text-on-primary font-label-md text-label-md px-6 py-3 rounded-xl hover:opacity-90 transition-opacity flex items-center gap-2 fab-shadow">

<a class="flex flex-col items-center justify-center text-textMuted dark:text-outline-variant px-4 py-1 hover:bg-surface-container-low dark:hover:bg-surface-variant scale-95 active:scale-90 transition-transform duration-150 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1">dashboard</span>

</a>

<span class="font-label-md text-label-md">Transactions</span>
</a>
